apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-collector
spec:
  schedule: "17 0,3,6,9,12,15 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: collector
              image: ghcr.io/OWNER/uptime-monitor:latest   # replace OWNER
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: data, mountPath: /app/data }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pipeline-data
