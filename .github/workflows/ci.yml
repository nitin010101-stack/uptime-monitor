name: ci

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "Dockerfile"
      - "sites.json"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Syntax check
        run: python -m compileall -q scripts tests

      - name: Lint (real errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Validate sites.json
        run: python -c "import json; d = json.load(open('sites.json')); assert d and all('name' in s and 'url' in s for s in d)"

      - name: Tests
        run: python -m pytest -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t uptime-monitor:ci .
